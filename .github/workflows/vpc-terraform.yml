
name: VPC Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: 01-vpc-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check AWS role variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "ERROR: AWS_ROLE_ARN repository variable is missing."
            exit 1
          fi

          if [[ "$AWS_ROLE_ARN" != arn:aws:iam::*:role/* ]]; then
            echo "ERROR: AWS_ROLE_ARN must contain the complete IAM role ARN."
            exit 1
          fi

          echo "AWS role ARN format looks correct."
      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform apply -input=false -auto-approve destroy.tfplan

