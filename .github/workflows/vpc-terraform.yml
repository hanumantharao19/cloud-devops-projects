
name: VPC Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: 01-vpc-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check AWS role variable
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "ERROR: AWS_ROLE_ARN repository variable is missing."
            exit 1
          fi

          if [[ "$AWS_ROLE_ARN" != arn:aws:iam::*:role/* ]]; then
            echo "ERROR: AWS_ROLE_ARN must contain the complete IAM role ARN."
            exit 1
          fi

          echo "AWS role ARN format looks correct."

      - name: Diagnose GitHub OIDC claims
        env:
          OIDC_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$OIDC_URL" || -z "$OIDC_REQUEST_TOKEN" ]]; then
            echo "ERROR: GitHub OIDC request environment is unavailable."
            exit 1
          fi

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $OIDC_REQUEST_TOKEN" \
            "${OIDC_URL}&audience=sts.amazonaws.com")

          TOKEN=$(python3 -c \
            'import json,sys; print(json.load(sys.stdin)["value"])' \
            <<< "$RESPONSE")

          python3 -c '
          import base64
          import json
          import sys

          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("OIDC subject:", claims.get("sub"))
          print("OIDC audience:", claims.get("aud"))
          ' "$TOKEN"

          unset TOKEN RESPONSE OIDC_REQUEST_TOKEN

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

